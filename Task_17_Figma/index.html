<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flip Card</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="frame">
    <div class="flip-card">
      <div class="flip-card-inner">

        <div class="flip-card-front">
          <h2 class="front-title">Financial Sector<br>Development<br>Program</h2>
          <span class="front-button">&#8599;</span>
        </div>

        <div class="flip-card-back">
          <h2 class="back-title">Financial Sector Development Program</h2>
          <p class="back-text">The Program aims to develop a diversified and effective financial sector to support the development of the Saudi Arabia's economy.</p>
          <div class="back-footer">
            <a class="read-more" href="#">Read More</a>
            <span class="back-button">&#8594;</span>
          </div>
        </div>

      </div>
    </div>
  </div>

</body>
</html>
